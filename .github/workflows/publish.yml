name: Publish

# Trusted publishing (OIDC): no API tokens.
# Register the publisher first (pending publisher, project does not exist yet):
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#   PyPI:     https://pypi.org/manage/account/publishing/
#   owner: gptfei, repository: devsnap, workflow: publish.yml, environment: (leave empty)
# Tag push (v*) or manual dispatch -> TestPyPI. GitHub Release published -> PyPI.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
