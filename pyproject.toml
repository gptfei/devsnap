[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsnap"
version = "0.1.0"
description = "Snapshot and diff your development environment — end 'works on my machine' debugging."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gptfei" }]
keywords = ["environment", "snapshot", "diff", "debugging", "devtools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gptfei/devsnap"
Repository = "https://github.com/gptfei/devsnap"
Issues = "https://github.com/gptfei/devsnap/issues"

[project.scripts]
devsnap = "devsnap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
